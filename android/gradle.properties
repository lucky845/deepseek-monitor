org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# JDK 21 + AGP JdkImageTransform/jlink 已知问题 workaround
android.enableDesugar=false
# Android Studio 自带 JBR 已升到 JDK 25.0.4，Kotlin 1.8.22 的 JavaVersion.parse
# 不认该版本串（IllegalArgumentException: 25.0.4，settings.gradle 插件解析崩）。
# 钉死 JDK 17，覆盖 flutter 经 Android Studio JBR 传入的 daemon javaHome。
# 换机器/CI 若无此路径，删掉本行即可（CI 不构建 Android 产物）。
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
