name: Build Multi-Platform

on:
  # 只有主分支跑流水线：PR 阶段不触发，合并进 main 之后才验证、打包、发布。
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: nothing gets packaged unless analyze and tests are green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本从 .fvmrc 读，和本地 FVM 用同一份声明，避免 CI 与开发环境漂移。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Web 端继续由流水线构建并部署到 GitHub Pages。
  # 各平台桌面/移动产物不再在 CI 中构建（节省 runner 分钟数），
  # 改由本地运行 tool/release_build.sh 打包后，再上传到 GitHub Release。
  build-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      # 该仓库已配置自定义域名 monitor.lucky845.top，站点部署在根路由 /。
      # --base-href / 让所有资产从域名根开始加载，不再带 /deepseek-monitor/ 前缀。
      # --pwa-strategy=none 保证每次部署都是最新构建，不被 Service Worker 缓存旧包。
      # --no-web-resources-cdn 保留着，但它已不再是「不关就白屏」那条：
      #   引擎 wasm 的来源现在由 web/flutter_bootstrap.js 的 canvasKitBaseUrl
      #   决定，指向 gstatic（br q11 比本站 gzip 小 21%，国内实测可达，见该文件注释）。
      #   留着它的作用是让 build/web/canvaskit/ 里留一份同源副本，作为
      #   buildConfig.engineRevision 取不到时的兜底（那时不设 canvasKitBaseUrl，
      #   引擎回落到同源 canvaskit/ 目录），同时保证引擎变体与本机构建一致。
      # --dart-define=PLATFORM_API_BASE 指向 Cloudflare Worker 反代
      #   （monitor.lucky845.top/platform-api/* -> platform.deepseek.com）。
      #   平台接口不回 CORS 头，浏览器直连必被拦；没有这行，网页端平台令牌
      #   那一路就是死的。反代部署与权限见 docs/web-and-proxy.md。
      # --wasm 让产物同时包含两套构建，浏览器自行挑：
      #   dart2wasm + skwasm   首选，渲染跑在 Web Worker 里
      #   dart2js  + canvaskit 回退，给不支持 WebAssembly GC 的浏览器
      # 实测（5 轮冷加载，1280x800，本地同源）：
      #   首帧        364 → 199ms   (-45%)
      #   TaskDuration 2152 → 240ms (-89%)
      #   longtask 总  2025 → 54ms  (-97%)  主线程 createImageBitmap 4 次 → 0 次
      #   传输体积     8.34 → 6.22MB (-25%)
      # skwasm 把光栅化和位图读回搬出主线程，canvaskit 在 Web 上没有 GPU
      # backdrop 通道、只能在主线程快照整屏，这才是它卡顿的根因。
      #
      # 代价：不支持 WebAssembly GC 的浏览器会走 js 回退，那部分用户要下载
      # 两套代码（约 8.3MB）。个人站，这个交换划算；要退回来只需删掉 --wasm。
      # 官方仍标注 "WebAssembly compilation is new"，故保留双构建而非纯 wasm。
      # -O4：wasm 侧编译器默认是 -O2，不是遗漏，是 flutter_tools 的有意取舍
      #   （WasmCompilerConfig.optimizationLevelForBuildMode 的注释：「-O2 uses
      #   only sound optimizations ... we would prefer soundness here」）。
      #   换 -O4 等于放弃 wasm 编译器的 soundness 检查，换来实测：
      #     main.dart.wasm 2,457,614 → 2,383,758 B（gzip 911,115 → 887,280，-2.6%）
      #     main.dart.js   3,062,049 → 2,926,070 B（gzip 901,266 → 861,135，-4.5%）
      #   js 侧本来就默认 -O4，所以老构建一直是「js O4 + wasm O2」。
      #   首帧实测（本地 HTTP/2，同轮配对）：Fast4G -23ms 8/8、Slow3G -112ms 5/5、
      #   宽带在噪声内（-1ms）。体积 1,186,506 → 1,162,671 B。
      #   回退方式：删掉这一行参数即可，无需改别的。
      - run: >-
          flutter build web --release
          --wasm
          -O4
          --pwa-strategy=none
          --base-href /
          --no-web-resources-cdn
          --dart-define=PLATFORM_API_BASE=https://monitor.lucky845.top/platform-api
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  # Publishes the web build so the browser target has a real URL to open.
  # Requires Pages to be set to the "GitHub Actions" source in repo settings.
  deploy-web:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
