name: Build Multi-Platform

on:
  # 只有主分支跑流水线：PR 阶段不触发，合并进 main 之后才验证、打包、发布。
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  # Gate: nothing gets packaged unless analyze and tests are green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Web 端继续由流水线构建并部署到 GitHub Pages。
  # 各平台桌面/移动产物不再在 CI 中构建（节省 runner 分钟数），
  # 改由本地运行 tool/release_build.sh 打包后，再上传到 GitHub Release。
  build-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # GitHub Pages serves a project site from /<repo>/, so every asset URL has
      # to carry that prefix or the deployed page loads a blank canvas.
      # --pwa-strategy=none keeps the service worker out of the way: a demo that
      # pins an old main.dart.js keeps showing yesterday's build.
      - run: flutter build web --release --pwa-strategy=none --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  # Publishes the web build so the browser target has a real URL to open.
  # Requires Pages to be set to the "GitHub Actions" source in repo settings.
  deploy-web:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
