name: Build Multi-Platform

on:
  # 只有主分支跑流水线：PR 阶段不触发，合并进 main 之后才验证、打包、发布。
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: nothing gets packaged unless analyze and tests are green.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本从 .fvmrc 读，和本地 FVM 用同一份声明，避免 CI 与开发环境漂移。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Web 端继续由流水线构建并部署到 GitHub Pages。
  # 各平台桌面/移动产物不再在 CI 中构建（节省 runner 分钟数），
  # 改由本地运行 tool/release_build.sh 打包后，再上传到 GitHub Release。
  build-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      # 该仓库已配置自定义域名 monitor.lucky845.top，站点部署在根路由 /。
      # --base-href / 让所有资产从域名根开始加载，不再带 /deepseek-monitor/ 前缀。
      # --pwa-strategy=none 保证每次部署都是最新构建，不被 Service Worker 缓存旧包。
      # --no-web-resources-cdn 是这里最重要的一条：不关掉它，Flutter 会去
      #   www.gstatic.com 拉 6.4MB 的 canvaskit.wasm，国内网络不可达，
      #   浏览器卡到超时 -> 长时间白屏。关掉后从本站 canvaskit/ 目录取。
      # --web-renderer=canvaskit 显式固定渲染器，避免 auto 在不同浏览器间行为漂移。
      - run: >-
          flutter build web --release
          --pwa-strategy=none
          --base-href /
          --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  # Publishes the web build so the browser target has a real URL to open.
  # Requires Pages to be set to the "GitHub Actions" source in repo settings.
  deploy-web:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
