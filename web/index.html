<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="让大肥鱼帮你看住钱包：余额、用量、花了多少钱，一眼就懂。">
  <meta name="theme-color" content="#0B1020">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="用量监控">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>DeepSeek 用量监控</title>
  <link rel="manifest" href="manifest.json">

  <!--
    首屏骨架：Flutter 引擎（main.dart.js 约 0.7MB gzip + canvaskit.wasm 约 1.9MB gzip）
    下载并启动前，body 是纯白的，用户看到几秒白屏。这里放一个与 App 同色系的骨架，
    引擎画出第一帧后由 main.dart 的回调移除。纯内联，不额外请求资源，不阻塞首屏。
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #0B1020; }
    #boot-skeleton {
      position: fixed; inset: 0; z-index: 9998;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: radial-gradient(120% 80% at 50% 0%, #16213D 0%, #0B1020 62%);
      color: #8FA3C8;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity .32s ease;
    }
    #boot-skeleton[data-done="1"] { opacity: 0; pointer-events: none; }
    .bs-logo {
      width: 54px; height: 54px; border-radius: 15px;
      background: linear-gradient(140deg, #4EC2C6, #2E7BF6);
      box-shadow: 0 8px 28px rgba(78, 194, 198, .28);
      animation: bs-pulse 1.7s ease-in-out infinite;
    }
    .bs-title { font-size: 15px; letter-spacing: .06em; color: #C7D4EA; }
    .bs-track {
      width: 156px; height: 3px; border-radius: 2px;
      background: rgba(143, 163, 200, .16); overflow: hidden;
    }
    .bs-bar {
      width: 42%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #4EC2C6, #2E7BF6);
      animation: bs-slide 1.15s ease-in-out infinite;
    }
    .bs-hint { font-size: 12px; color: #5A6C8C; letter-spacing: .03em; }
    @keyframes bs-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.93); opacity: .8; }
    }
    @keyframes bs-slide {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(340%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bs-logo, .bs-bar { animation: none; }
    }
  </style>

  <!--
    提前预取中文兜底字体。引擎是画到「缺字形」的字符才去下载它的，而那时首帧早过了，
    下完还得重排一次（4G 下多花几百毫秒）。

    Flutter 3.45+ 起引擎改用 v37 分片（按字符切、按需取）。32 片里这一片覆盖了
    lib/ 中 118/413 个汉字（28.6%，按字符数排第一），27.5KB，作为首帧快路径预取；
    其余分片由引擎在真正用到时按需加载，避免把 217KB 全量推给只看看首页的用户。

    文件名里的 hash 由引擎在构建时写死，子集只能原地替换内容（见 docs/web-and-proxy.md）；
    哪天 Flutter 升级改了这个 hash，这里就会 404 —— test/web_font_subset_test.dart 会拦住。
  -->
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.118.woff2" crossorigin>
  <!--
    这里**故意不预取** canvaskit.wasm，别再把它加回来。

    引擎不会加载 canvaskit/canvaskit.wasm，而是按浏览器能力挑变体：
    Chromium 走 canvaskit/chromium/canvaskit.wasm（5.4MB / gzip 2.1MB），
    支持 TextCluster 的走 canvaskit/webparagraph/（3.7MB）。
    在 index.html 里 preload 根目录那份，等于让浏览器白下 7.3MB（gzip 2.9MB、
    实测 1.28s），随后引擎再下它真正要的那份 —— 首屏凭空多背一次完整下载。

    实测（Chrome，本地）：去掉这行后 canvaskit 只剩 1 个请求。
    test/web_boot_assets_test.dart 会拦住重新加回来。
  -->
</head>
<body>
  <div id="boot-skeleton" role="status" aria-live="polite">
    <div class="bs-logo"></div>
    <div class="bs-title">DeepSeek 用量监控</div>
    <div class="bs-track"><div class="bs-bar"></div></div>
    <div class="bs-hint">正在加载界面…</div>
  </div>

  <script>
    // 骨架移除：优先由 Flutter 第一帧触发；这里的定时器只是兜底，
    // 万一引擎或网络彻底失败，30 秒后也不会让用户永远停在加载态。
    (function () {
      function dropSkeleton() {
        var sk = document.getElementById('boot-skeleton');
        if (!sk) return;
        sk.setAttribute('data-done', '1');
        setTimeout(function () {
          if (sk.parentNode) sk.parentNode.removeChild(sk);
        }, 380);
      }
      window.__dropBootSkeleton = dropSkeleton;
      setTimeout(dropSkeleton, 30000);
    })();
  </script>

  <!--
    这里不能直接 <script src="flutter_bootstrap.js" async>，先注销残留 Service Worker 再注入。

    Flutter 3.47 起 service worker 被废弃：flutter_bootstrap.js 写死 serviceWorkerVersion: null，
    flutter_service_worker.js 是 0 字节（--pwa-strategy=none）。但早期部署在用户浏览器里注册的
    旧 SW（?v=<旧hash>）不会自己消失。bootstrap 的 loadServiceWorker 见到旧 registration 就
    update() 出一个新 SW——0 字节脚本没有 skipWaiting，永远停在 waiting，
    _waitForServiceWorkerActivation 只能等到 4000ms 超时，之后才 Injecting <script>。
    于是 main.dart.js 晚发 4 秒，network 中段整段空窗（开屏动画转的就是这 4 秒）。
    先 unregister 再注入 bootstrap：loader 走 getRegistration() 为空的快路径，不注册不等待。
  -->
  <script>
    (function () {
      function injectBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(injectBootstrap, injectBootstrap);
      } else {
        injectBootstrap();
      }
    })();
  </script>
</body>
</html>
