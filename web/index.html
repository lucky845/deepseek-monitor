<html lang="zh-CN">
<head>

  <!--
    首屏骨架：Flutter 引擎（main.dart.js 约 0.7MB gzip + canvaskit.wasm 约 1.9MB gzip）
    下载并启动前，body 是纯白的，用户看到几秒白屏。这里放一个与 App 同色系的骨架，
    引擎画出第一帧后由 main.dart 的回调移除。纯内联，不额外请求资源，不阻塞首屏。
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #0B1020; }
    #boot-skeleton {
      position: fixed; inset: 0; z-index: 9998;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: radial-gradient(120% 80% at 50% 0%, #16213D 0%, #0B1020 62%);
      color: #8FA3C8;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      will-change: opacity;
    }
    /* 淡出必须由合成线程驱动，不能靠 transition + JS 定时器。
       线上实测：data-done=1 在 1259ms 落下时，主线程正被一个 890ms 的 wasm
       编译长任务占着，样式重算被阻塞——opacity 在 1670ms 仍是 1，而 JS 移除
       定时器到期后 DOM 直接消失，用户看到的是"骨架僵硬地停 1.2 秒然后跳掉"，
       渐变一次都没跑过。本地主线程空闲，所以之前测到的 181ms 是假象。

       animation 在合成线程执行，主线程卡住也不影响它起跑。 */
    @keyframes bs-out {
      from { opacity: 1; }
      to { opacity: 0; visibility: hidden; }
    }
    #boot-skeleton[data-done="1"] {
      pointer-events: none;
      animation: bs-out .18s linear forwards;
    }
    .bs-logo {
      width: 54px; height: 54px; border-radius: 15px;
      background: linear-gradient(140deg, #4EC2C6, #2E7BF6);
      box-shadow: 0 8px 28px rgba(78, 194, 198, .28);
      animation: bs-pulse 1.7s ease-in-out infinite;
    }
    .bs-title { font-size: 15px; letter-spacing: .06em; color: #C7D4EA; }
    .bs-track {
      width: 156px; height: 3px; border-radius: 2px;
      background: rgba(143, 163, 200, .16); overflow: hidden;
    }
    .bs-bar {
      width: 42%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #4EC2C6, #2E7BF6);
      animation: bs-slide 1.15s ease-in-out infinite;
    }
    .bs-hint { font-size: 12px; color: #5A6C8C; letter-spacing: .03em; }
    /* The two keyframes below are the only work the skeleton does besides two
       gradients. They are stopped the moment Flutter reports its first frame
       (data-done=1) — before that they are the "something is happening" signal,
       after it they would just keep compositing a layer nobody is looking at. */
    #boot-skeleton[data-done="1"] .bs-logo,
    #boot-skeleton[data-done="1"] .bs-bar { animation: none; }
    @keyframes bs-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.93); opacity: .8; }
    }
    @keyframes bs-slide {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(340%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bs-logo, .bs-bar { animation: none; }
    }
  </style>

  <!--
    提前预取中文兜底字体。引擎是画到「缺字形」的字符才去下载它的，而那时首帧早过了，
    下完还得重排一次 —— 界面先出来、字全是空白，正是「字体最慢」的来源。

    Flutter 3.45+ 起引擎改用 v37 分片（按字符切、按需取），32 片里首屏真正用到 11 片
    （109–119，共 137KB，覆盖 lib/ 全部 413 个非 ASCII 字符）。这里把它们全部 preload：
      - 本地/高速网：字体齐活 2256ms → 225ms
      - Fast 4G   ：字体齐活 7250ms → 5076ms（首帧 +221ms，换来文字早 2.2s 可读）
    实测只预取 5 片或 8 片没有效果 —— 引擎照样等到「缺字形」那一刻才发剩余请求，
    所以要么全预取，要么别预取。

    文件名里的 hash 由引擎在构建时写死，子集只能原地替换内容（见 docs/web-and-proxy.md）；
    哪天 Flutter 升级改了这个 hash，这里就会 404 —— test/web_font_subset_test.dart 会拦住。
  -->
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.109.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.110.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.111.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.112.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.113.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.114.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.115.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.116.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.117.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.118.woff2" crossorigin>
  <link rel="preload" as="fetch" href="fonts/notosanssc/v37/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYkldv7JjxkkgFsFSSOPMOkySAZ73y9ViAt3acb8NexQ2w.119.woff2" crossorigin>
  <!--
    这里**故意不预取** canvaskit.wasm，别再把它加回来。

    引擎不会加载 canvaskit/canvaskit.wasm，而是按浏览器能力挑变体：
    Chromium 走 canvaskit/chromium/canvaskit.wasm（5.4MB / gzip 2.1MB），
    支持 TextCluster 的走 canvaskit/webparagraph/（3.7MB）。
    在 index.html 里 preload 根目录那份，等于让浏览器白下 7.3MB（gzip 2.9MB、
    实测 1.28s），随后引擎再下它真正要的那份 —— 首屏凭空多背一次完整下载。

    实测（Chrome，本地）：去掉这行后 canvaskit 只剩 1 个请求。
    test/web_boot_assets_test.dart 会拦住重新加回来。
  -->

  <!--
    把整条 wasm 启动链在解析 HTML 时就全部发出去，而不是等 bootstrap 一档档发现。

    引擎的加载是一条串行链：flutter_bootstrap.js → 解析出 main.dart.mjs →
    才请求 skwasm.js / skwasm.wasm / main.dart.wasm。每一跳都要等前一个下载
    完才能发，HTTP/2 上每跳约 1 个 RTT。这四个文件加起来 2.5MB，链路却要
    4 跳才铺满带宽，大部分时间里连接是闲的。

    实测（本地 HTTP/2 + CDP 节流，两臂同一份 build/web，配对同轮相减）：
      Fast 4G (9Mbps/40ms)    2980 → 2602ms   -376ms   6/6
      宽带   (40Mbps/20ms)    1331 →  935ms   -332ms   5/6
      Slow 3G(1.6Mbps/100ms) 13385 → 13376ms    +2ms   2/4（持平）

    体积零代价：两臂 transferSize 合计都是 2,744,836B、资源数都是 23 ——
modulepreload 走的是模块图，不会像 preload as=script 那样多下一份副本。

    为什么 Slow 3G 不赚：那时瓶颈是 1.5MB 的 skwasm.wasm 本身要下 12 秒，
    提前 600ms 发起也改变不了它什么时候下完，反而挤占了 main.dart.mjs 的连接。
    收益 ≈ min(省下的发现延迟, 带宽排队时间)，带宽足够时才为正。

    为什么必须门控 WasmGC：
      index.html 是 js / wasm 两套构建共用的。浏览器不支持 WasmGC 时
      flutter_bootstrap.js 会回退去下 main.dart.js + canvaskit.wasm（3.2MB），
      不会碰这里预取的任何一个文件 —— 白下 2.5MB，等于把首屏拖慢一倍。
      所以先用和引擎完全相同的探针（flutter_js/flutter.js 里的 B()）判一次，
      支持才注入。探针字节必须与引擎一致，否则会出现「页面预取了 wasm 构建、
      引擎却走 js 回退」，两边都在下用户永远用不到的东西。
      负向实测：把该探针拦成 false 后，页面一条 link 都不注入，请求列表与改动前
      完全一致（只有 main.dart.js + canvaskit/chromium/canvaskit.wasm，
      transferSize 3,150,607B），零浪费。

    注意 rel 不能写混：main.dart.mjs 与 skwasm.js 是 ES module，用
    modulepreload 才会进模块图（用 preload as=script 会拿到一份不进模块
    缓存的副本，等于下两遍）；两个 .wasm 用 preload as=fetch + crossorigin。
    test/web_boot_assets_test.dart 会校验这里列的每一项。

    ---- 那两个引擎文件为什么是 gstatic 的绝对地址 ----

    skwasm.js / skwasm.wasm 不再从本站取：本站（Cloudflare 免费版）给的是
    gzip 1,551,371B，而 gstatic 同一份产物给 br q11 1,225,993B —— 差 325KB / −21%。
    根因是 CF 对源站已经 gzip 过的流再压一遍（本地 zlib 复现 br11(gzip9)
    = 1,535,137B，与生产实测 1,540,088B 只差 0.3%），只有拿到原始流才可能有
    21% 这个量级（raw→br：q4 −0.7%、q5 −7.6%、q9 −10.4%、q11 −21.3%）。
    详见 flutter_bootstrap.js 顶部注释里的完整实测。

    preconnect 提前把 TLS 握掉（国内直连 gstatic 实测 TCP 26–46ms、
    TLS 95–117ms、TTFB 161–188ms），否则这段建连会压在那 1.2MB 前面。

    实测（本地 HTTP/2，两臂同一份 build/web，同轮配对相减）：
      Fast 4G (9Mbps/40ms)    2517 → 2254ms   -266ms   5/5
      宽带    (40Mbps/20ms)    702 →  695ms     -4ms   4/6（噪声）
      Slow 3G (1.6Mbps/100ms) 13162 → 11679ms -1481ms  4/4
    transferSize 合计 2,739,484 → 1,186,561B，资源数都是 23，无重复下载。
    宽带这一档从上一轮的 +77ms 回退变成持平，靠的就是这条 preconnect。

    ---- 后半段：字体与清单资源 ----

    wasm 到齐只是「引擎能启动了」，接下来还有一截纯串行的小请求，
    每一步都在等上一步的回包，而每个包 gzip 后只有几百字节到 37KB：

      FontManifest.json (298B) → MaterialIcons / Roboto / CupertinoIcons
                               → AssetManifest.bin.json → 业务资源

    这条链最早只能在主线程跑起来之后才发起：读 index.html 时还不知道要下
    哪几份字体。实测（生产页面，wasm 全部到齐之后）FontManifest.json
    直到 1542→1781ms 才完成，MaterialIcons 1786→2005ms（下面带 B 的都是 transferSize），
    AssetManifest.bin.json 2284→2501ms，首帧被吊在后面。

    把五项一起预取后（本地 HTTP/2 + CDP 节流，两臂同一份 build/web，
    配对同轮相减）：
      Fast 4G (9Mbps/40ms)     2612 → 2523ms    -86ms   6/6
      宽带   (40Mbps/20ms)      748 →  701ms    -45ms   5/6
      Slow 3G(1.6Mbps/100ms)  13354 → 13157ms  -193ms   4/4
    资源数与 transferSize 两臂完全一致（23 条 / 2,739,484B），没有重复下载。

    为什么必须门控：这五项是 wasm 构建的产物。js 回退分支（不支持 WasmGC
    的浏览器）根本不读它们，所以和上面五个一样放在同一个探针后面。
    负向实测：把探针拦成 false 后，两臂资源数都是 20、transferSize 都是
    3,145,255B，一字不差。

    Roboto 那份 36,950B 是子集（见 tool/subset_web_fonts.py），不是全量
    167.7KB —— 预取它不会把首屏流量放大。
  -->
  <script>
    (function () {
      // 与 flutter_bootstrap.js 里 B() 的探针字节保持一致。
      var probe = [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0];
      try {
        if (!WebAssembly.validate(new Uint8Array(probe))) return;
      } catch (e) {
        return;
      }
      // 引擎 wasm 从 gstatic 取（理由见 flutter_bootstrap.js 顶部注释）。
      // 跨源建连 TLS 约 95–117ms，提前在解析 HTML 阶段握掉，别让它压在
      // 1.2MB 的 skwasm.wasm 前面。
      var pre = document.createElement('link');
      pre.rel = 'preconnect';
      pre.href = 'https://www.gstatic.com';
      pre.crossOrigin = '';
      document.head.appendChild(pre);
      var links = [
        ['preload', 'script', 'flutter_bootstrap.js', false],
        ['modulepreload', null, 'main.dart.mjs', true],
        ['modulepreload', null, 'https://www.gstatic.com/flutter-canvaskit/89c39edfdfae2949f6806e4a315c0c08522238b7/skwasm.js', true],
        ['preload', 'fetch', 'https://www.gstatic.com/flutter-canvaskit/89c39edfdfae2949f6806e4a315c0c08522238b7/skwasm.wasm', true],
        ['preload', 'fetch', 'main.dart.wasm', true],
        ['preload', 'fetch', 'assets/FontManifest.json', true],
        ['preload', 'fetch', 'assets/AssetManifest.bin.json', true],
        ['preload', 'fetch', 'assets/fonts/MaterialIcons-Regular.otf', true],
        ['preload', 'fetch', 'assets/fonts/roboto/v20/KFOmCnqEu92Fr1Me5WZLCzYlKw.ttf', true],
        ['preload', 'fetch', 'assets/packages/cupertino_icons/assets/CupertinoIcons.ttf', true]
      ];
      for (var i = 0; i < links.length; i++) {
        var link = document.createElement('link');
        link.rel = links[i][0];
        if (links[i][1]) link.as = links[i][1];
        link.href = links[i][2];
        if (links[i][3]) link.crossOrigin = '';
        document.head.appendChild(link);
      }
    })();
  </script>
</head>
<body>
  <div id="boot-skeleton" role="status" aria-live="polite">
    <div class="bs-logo"></div>
    <div class="bs-title">DeepSeek 用量监控</div>
    <div class="bs-track"><div class="bs-bar"></div></div>
    <div class="bs-hint">正在加载界面…</div>
  </div>

  <script>
    // 骨架移除：优先由 Flutter 第一帧触发；这里的定时器只是兜底，
    // 万一引擎或网络彻底失败，30 秒后也不会让用户永远停在加载态。
    (function () {
      function dropSkeleton() {
        var sk = document.getElementById('boot-skeleton');
        if (!sk) return;
        // 触发 CSS 动画（合成线程执行，主线程卡住也照跑）。
        sk.setAttribute('data-done', '1');
        // DOM 移除只是收尾，不承担"什么时候让用户看到界面"的职责——那件事
        // 已经交给 animation 了。主线程被长任务占住时这个定时器会晚到，
        // 但那时骨架早已 opacity=0 且 visibility=hidden，不会挡住界面。
        setTimeout(function () {
          if (sk.parentNode) sk.parentNode.removeChild(sk);
        }, 1200);
      }
      window.__dropBootSkeleton = dropSkeleton;
      setTimeout(dropSkeleton, 30000);
    })();
  </script>

  <!--
    这里不能直接 <script src="flutter_bootstrap.js" async>，先注销残留 Service Worker 再注入。

    Flutter 3.47 起 service worker 被废弃：flutter_bootstrap.js 写死 serviceWorkerVersion: null，
    flutter_service_worker.js 是 0 字节（--pwa-strategy=none）。但早期部署在用户浏览器里注册的
    旧 SW（?v=<旧hash>）不会自己消失。bootstrap 的 loadServiceWorker 见到旧 registration 就
    update() 出一个新 SW——0 字节脚本没有 skipWaiting，永远停在 waiting，
    _waitForServiceWorkerActivation 只能等到 4000ms 超时，之后才 Injecting <script>。
    于是 main.dart.js 晚发 4 秒，network 中段整段空窗（开屏动画转的就是这 4 秒）。
    先 unregister 再注入 bootstrap：loader 走 getRegistration() 为空的快路径，不注册不等待。
  -->
  <script>
    (function () {
      function injectBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(injectBootstrap, injectBootstrap);
      } else {
        injectBootstrap();
      }
    })();
  </script>
</body>
</html>
